name: Update daily word

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vocabulary-builder-daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update the word
        env:
          DUOCARDS_DECK_ID: RGVjazoxYzIyYzgxMy1jNjJkLTQ0NGUtYTMzMi1lZjBhMDhmMjdhYjU=
          WIKIMEDIA_USER_AGENT: VocabularyBuilder/1.0 (${{ github.server_url }}/${{ github.repository }})
        run: python scripts/update_word.py

      - name: Validate generated files
        run: python -m unittest discover -s tests -v

      - name: Commit changed output
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add word.json word.txt data/history.json
          if git diff --cached --quiet; then
            echo "No output change."
            exit 0
          fi
          git commit -m "Update daily word"
          git push

